version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ksp-postgres
    environment:
      POSTGRES_USER: ksp_user
      POSTGRES_PASSWORD: ksp_secure_pass_2025
      POSTGRES_DB: ksp_crime_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksp_user -d ksp_crime_intel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ksp-network

  # ── Neo4j ──────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: ksp-neo4j
    environment:
      NEO4J_AUTH: neo4j/ksp_neo4j_2025
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ksp_neo4j_2025 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - ksp-network

  # ── Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ksp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ksp-network

  # ── ChromaDB ───────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: ksp-chromadb
    ports:
      - "8100:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    networks:
      - ksp-network

  # ── FastAPI Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ksp-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ksp_user:ksp_secure_pass_2025@postgres:5432/ksp_crime_intel
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../app:/app/app
      - ../scripts:/app/scripts
    networks:
      - ksp-network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  chromadb_data:

networks:
  ksp-network:
    driver: bridge
